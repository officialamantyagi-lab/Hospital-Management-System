<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Patient Management</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<div class="card shadow-lg">

<div class="card-header bg-primary text-white">

<h3><i class="bi bi-person-plus-fill"></i> Patient Registration</h3>

</div>

<div class="card-body">

{% if patient %}

<form action="/update_patient/{{patient.patient_id}}" method="post">

{% else %}

<form action="/add_patient" method="post">

{% endif %}

<div class="row">

<div class="col-md-6 mb-3">

<label class="form-label">Patient Name</label>

<input
type="text"
class="form-control"
name="patient_name"
value="{{patient.patient_name if patient else ''}}"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">Gender</label>

<select class="form-select" name="gender">

<option value="Male"
{% if patient and patient.gender=="Male" %}selected{% endif %}>
Male
</option>

<option value="Female"
{% if patient and patient.gender=="Female" %}selected{% endif %}>
Female
</option>

<option value="Other"
{% if patient and patient.gender=="Other" %}selected{% endif %}>
Other
</option>

</select>

</div>

<div class="col-md-4 mb-3">

<label class="form-label">Age</label>

<input
type="number"
class="form-control"
name="age"
value="{{patient.age if patient else ''}}"
required>

</div>

<div class="col-md-4 mb-3">

<label class="form-label">Phone</label>

<input
type="text"
class="form-control"
name="phone"
value="{{patient.phone if patient else ''}}"
required>

</div>

<div class="col-md-4 mb-3">

<label class="form-label">Blood Group</label>

<input
type="text"
class="form-control"
name="blood_group"
value="{{patient.blood_group if patient else ''}}"
required>

</div>

<div class="col-12 mb-3">

<label class="form-label">Address</label>

<textarea
class="form-control"
name="address"
rows="3"
required>{{patient.address if patient else ''}}</textarea>

</div>

</div>

{% if patient %}

<button class="btn btn-warning">

<i class="bi bi-pencil-square"></i>

Update Patient

</button>

{% else %}

<button class="btn btn-success">

<i class="bi bi-check-circle-fill"></i>

Save Patient

</button>

{% endif %}

<a href="/patients" class="btn btn-primary">

<i class="bi bi-table"></i>

View Patients

</a>

</form>

</div>

</div>

</div>

</body>

</html>
