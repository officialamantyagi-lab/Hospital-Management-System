<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Billing</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<div class="card shadow">

<div class="card-header bg-danger text-white">

<h3><i class="bi bi-receipt"></i> Patient Billing</h3>

</div>

<div class="card-body">

<form action="/add_bill" method="post">

<div class="row">

<div class="col-md-4 mb-3">
<label>Patient ID</label>
<input type="number" class="form-control" name="patient_id" required>
</div>

<div class="col-md-4 mb-3">
<label>Amount</label>
<input type="number" step="0.01" class="form-control" name="amount" required>
</div>

<div class="col-md-4 mb-3">
<label>Payment Status</label>

<select class="form-select" name="payment_status">

<option>Paid</option>
<option>Pending</option>

</select>

</div>

<div class="col-md-12 mb-3">

<label>Bill Date</label>

<input type="date" class="form-control" name="bill_date" required>

</div>

</div>

<button class="btn btn-danger">

<i class="bi bi-save"></i>

Save Bill

</button>

<a href="/bills" class="btn btn-primary">

View Bills

</a>

</form>

</div>

</div>

</div>

</body>

</html>
