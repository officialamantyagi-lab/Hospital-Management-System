<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doctor Management</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<div class="card shadow">

<div class="card-header bg-success text-white">

<h3><i class="bi bi-person-badge-fill"></i> Doctor Registration</h3>

</div>

<div class="card-body">

<form action="/add_doctor" method="post">

<div class="row">

<div class="col-md-6 mb-3">
<label>Name</label>
<input type="text" class="form-control" name="doctor_name" required>
</div>

<div class="col-md-6 mb-3">
<label>Gender</label>
<select class="form-select" name="gender">
<option>Male</option>
<option>Female</option>
<option>Other</option>
</select>
</div>

<div class="col-md-6 mb-3">
<label>Phone</label>
<input type="text" class="form-control" name="phone" required>
</div>

<div class="col-md-6 mb-3">
<label>Specialization</label>
<input type="text" class="form-control" name="specialization" required>
</div>

<div class="col-md-6 mb-3">
<label>Experience (Years)</label>
<input type="number" class="form-control" name="experience" required>
</div>

<div class="col-md-6 mb-3">
<label>Department ID</label>
<input type="number" class="form-control" name="department_id" required>
</div>

</div>

<button class="btn btn-success">
<i class="bi bi-check-circle"></i>
Save Doctor
</button>

<a href="/doctors" class="btn btn-primary">
View Doctors
</a>

</form>

</div>

</div>

</div>

</body>
</html>
