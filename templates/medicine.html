<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Medicine</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<div class="card shadow">

<div class="card-header bg-success text-white">

<h3>Add Medicine</h3>

</div>

<div class="card-body">

<form action="/add_medicine" method="post">

<div class="mb-3">

<label>Medicine Name</label>

<input type="text"
name="medicine_name"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Company</label>

<input type="text"
name="company"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Price</label>

<input type="number"
step="0.01"
name="price"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Stock</label>

<input type="number"
name="stock"
class="form-control"
required>

</div>

<button class="btn btn-success">

Save Medicine

</button>

<a href="/medicines" class="btn btn-primary">

View Medicines

</a>

</form>

</div>

</div>

</div>

</body>

</html>
