<!DOCTYPE html>
<html lang="en">

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Patients</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<div class="card shadow-lg">

<div class="card-header bg-primary text-white d-flex justify-content-between">

<h3><i class="bi bi-people-fill"></i> Patients</h3>

<a href="/patient" class="btn btn-light">

<i class="bi bi-person-plus-fill"></i>

Add Patient

</a>

</div>
<form action="/patients" method="get" class="mb-3">

    <input
        type="text"
        name="search"
        class="form-control"
        placeholder="Search Patient Name">

    <br>

    <button class="btn btn-primary">
        Search
    </button>

</form>
<div class="card-body">

<div class="table-responsive">
<table class="table table-bordered table-hover">

<thead class="table-dark">

<tr>

<th>ID</th>
<th>Name</th>
<th>Gender</th>
<th>Age</th>
<th>Phone</th>
<th>Blood Group</th>
<th>Address</th>
<th width="170">Action</th>

</tr>

</thead>

<tbody>

{% for p in patients %}

<tr>

<td>{{p.patient_id}}</td>

<td>{{p.patient_name}}</td>

<td>{{p.gender}}</td>

<td>{{p.age}}</td>

<td>{{p.phone}}</td>

<td>{{p.blood_group}}</td>

<td>{{p.address}}</td>

<td>

<a href="/edit_patient/{{p.patient_id}}" class="btn btn-warning btn-sm">

<i class="bi bi-pencil-square"></i>

</a>

<a href="/delete_patient/{{p.patient_id}}"

class="btn btn-danger btn-sm"

onclick="return confirm('Delete this patient?')">

<i class="bi bi-trash-fill"></i>

</a>

</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

</div>

</div>

</div>

</body>

</html>
