<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Doctors</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

</head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<body class="bg-light">

<div class="container mt-5">

<div class="card shadow">

<div class="card-header bg-success text-white d-flex justify-content-between">

<h3><i class="bi bi-person-badge-fill"></i> Doctors List</h3>

<a href="/doctor" class="btn btn-light">
<i class="bi bi-person-plus-fill"></i>
Add Doctor
</a>

</div>

<div class="card-body">

<table class="table table-bordered table-hover">

<thead class="table-success">

<tr>

<th>ID</th>
<th>Name</th>
<th>Gender</th>
<th>Phone</th>
<th>Specialization</th>
<th>Experience</th>
<th>Department ID</th>
<th>Action</th>

</tr>

</thead>

<tbody>

{% for d in doctors %}

<tr>

<td>{{d.doctor_id}}</td>
<td>{{d.doctor_name}}</td>
<td>{{d.gender}}</td>
<td>{{d.phone}}</td>
<td>{{d.specialization}}</td>
<td>{{d.experience}}</td>
<td>{{d.department_id}}</td>

<td>

<a href="/edit_doctor/{{d.doctor_id}}" class="btn btn-warning btn-sm">
<i class="bi bi-pencil-square"></i>
</a>

<a href="/delete_doctor/{{d.doctor_id}}"
class="btn btn-danger btn-sm"
onclick="return confirm('Delete Doctor?')">

<i class="bi bi-trash-fill"></i>

</a>

</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

</div>

</div>

</body>

</html>
