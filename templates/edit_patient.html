<!DOCTYPE html>
<html lang="en">

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Edit Patient</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<div class="card shadow">

<div class="card-header bg-warning">

<h3>

<i class="bi bi-pencil-square"></i>

Edit Patient

</h3>

</div>

<div class="card-body">

<form action="/update_patient/{{patient.patient_id}}" method="post">

<div class="row">

<div class="col-md-6 mb-3">

<label>Name</label>

<input

type="text"

name="patient_name"

class="form-control"

value="{{patient.patient_name}}"

required>

</div>

<div class="col-md-6 mb-3">

<label>Gender</label>

<select

name="gender"

class="form-select">

<option {% if patient.gender=="Male" %}selected{% endif %}>Male</option>

<option {% if patient.gender=="Female" %}selected{% endif %}>Female</option>

<option {% if patient.gender=="Other" %}selected{% endif %}>Other</option>

</select>

</div>

<div class="col-md-4 mb-3">

<label>Age</label>

<input

type="number"

name="age"

class="form-control"

value="{{patient.age}}"

required>

</div>

<div class="col-md-4 mb-3">

<label>Phone</label>

<input

type="text"

name="phone"

class="form-control"

value="{{patient.phone}}"

required>

</div>

<div class="col-md-4 mb-3">

<label>Blood Group</label>

<input

type="text"

name="blood_group"

class="form-control"

value="{{patient.blood_group}}"

required>

</div>

<div class="col-12 mb-3">

<label>Address</label>

<textarea

name="address"

class="form-control"

rows="3"

required>{{patient.address}}</textarea>

</div>

</div>

<button class="btn btn-warning">

<i class="bi bi-check-circle"></i>

Update Patient

</button>

<a href="/patients"

class="btn btn-secondary">

Back

</a>

</form>

</div>

</div>

</div>

</body>

</html>
