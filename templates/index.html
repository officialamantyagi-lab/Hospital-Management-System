<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hospital Management System</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

<link rel="stylesheet" href="/static/style.css">

</head>

<body>

<div class="sidebar">

<h3><i class="bi bi-hospital"></i> HMS</h3>

<a href="#"><i class="bi bi-speedometer2"></i> Dashboard</a>

<a href="/patients"><i class="bi bi-people-fill"></i> Patients</a>

<a href="/doctor"><i class="bi bi-person-badge-fill"></i> Doctors</a>

<a href="/appointment"><i class="bi bi-calendar-check"></i> Appointments</a>

<a href="/medicine"><i class="bi bi-capsule-pill"></i> Medicines</a>

<a href="/billing"><i class="bi bi-receipt-cutoff"></i> Billing</a>

</div>

<div class="main">

<h2>Hospital Management Dashboard</h2>

<div class="row mt-4">

<div class="col-md-3">

<div class="card shadow card-box">

<h5>Total Patients</h5>

<h2>{{patients}}</h2>

</div>

</div>

<div class="col-md-3">

<div class="card shadow card-box">

<h5>Total Doctors</h5>

<h2>{{doctors}}</h2>

</div>

</div>

<div class="col-md-3">

<div class="card shadow card-box">

<h5>Appointments</h5>

<h2>{{appointments}}</h2>

</div>

</div>

<div class="col-md-3">

<div class="card shadow card-box">

<h5>Total Revenue</h5>

<h2>₹ {{revenue}}</h2>

</div>

</div>

</div>

</div>

</body>
</html>

<a href="/logout">
    <i class="bi bi-box-arrow-right"></i>
    Logout
</a>
