<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bills</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<body class="bg-light">

<div class="container mt-5">

    <h2 class="mb-4">Bills List</h2>

    <a href="/billing" class="btn btn-primary mb-3">
        Add New Bill
    </a>

    <table class="table table-bordered table-hover">

        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Patient ID</th>
                <th>Amount</th>
                <th>Status</th>
                <th>Date</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody>

        {% for b in bills %}

        <tr>

            <td>{{ b.bill_id }}</td>
            <td>{{ b.patient_id }}</td>
            <td>{{ b.amount }}</td>
            <td>{{ b.payment_status }}</td>
            <td>{{ b.bill_date }}</td>

            <td>
                <a href="/print_bill/{{ b.bill_id }}"
   class="btn btn-success btn-sm"
   target="_blank">
    Print PDF
</a>
                <a href="/delete_bill/{{ b.bill_id }}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('Delete Bill?')">
                    Delete
                </a>
            </td>

        </tr>

        {% endfor %}

        </tbody>

    </table>

</div>

</body>
</html>
